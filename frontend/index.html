<!doctype html>
<html lang="en" class="dark">

    <meta
      name="description"
      content="StyleO helps you digitize your wardrobe, track garment lifecycle, and get AI-powered outfit recommendations based on what you actually own."
    />

      name="keywords"
      content="AI wardrobe app, digital closet, outfit recommendations, wardrobe management, closet organizer, fashion assistant, StyleO"
    />
    <meta name="author" content="StyleO" />
    <meta name="application-name" content="StyleO" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="StyleO" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="StyleO | AI Wardrobe Management & Outfit Recommendations"
    />
    <meta
      property="og:description"
      content="Digitize your wardrobe, track garment availability, and receive context-aware outfit recommendations powered by AI."
    />
    <meta property="og:url" content="https://styleo.vercel.app/" />

    <meta name="twitter:card" content="summary" />

      name="twitter:title"

    />

      name="twitter:description"

      name="google-site-verification"
      content="tCka_vBbNOpFDcyuiKnP4sVrgsfBF4BNBKFdjbR0kfk"
    />
    <!-- Fonts: Cormorant Garamond (display) + Space Grotesk (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "light") {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <script type="application/ld+json" id="styleo-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "StyleO",
        "url": "https://styleo.vercel.app/",
        "description": "AI wardrobe management platform for digitizing your closet and generating outfit recommendations.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://styleo.vercel.app/",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
