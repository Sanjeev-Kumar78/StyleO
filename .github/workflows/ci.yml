name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile Python sources
        run: uv run python -m compileall -q main.py core db models routes services workers
