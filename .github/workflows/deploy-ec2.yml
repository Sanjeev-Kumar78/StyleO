name: StyleO CI/CD (EC2 via SSM)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mask AWS Role Name
        run: |
          # Extract the role name from the IAM ARN and tell GitHub Actions to mask it
          ROLE_ARN="${{ secrets.AWS_ROLE_ARN }}"
          ROLE_NAME=$(echo "$ROLE_ARN" | awk -F/ '{print $NF}')
          echo "::add-mask::$ROLE_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Start EC2 if stopped
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"
            aws ec2 wait instance-running --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"
            sleep 10
          fi

      - name: Deploy to EC2 using SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "StyleO Deployment" \
            --parameters commands="[
              \"sudo -i -u ec2-user bash -c 'cd ~/styleo && ./deploy.sh'\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          DEPLOY_TIMEOUT_SECONDS=600
          POLL_INTERVAL_SECONDS=10
          ELAPSED_SECONDS=0
          FINAL_STATUS=""

          while [ "$ELAPSED_SECONDS" -lt "$DEPLOY_TIMEOUT_SECONDS" ]; do
            FINAL_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: ${FINAL_STATUS:-Unknown} (elapsed ${ELAPSED_SECONDS}s)"

            case "$FINAL_STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed|"")
                sleep "$POLL_INTERVAL_SECONDS"
                ELAPSED_SECONDS=$((ELAPSED_SECONDS + POLL_INTERVAL_SECONDS))
                ;;
              *)
                echo "Unexpected SSM status: $FINAL_STATUS"
                sleep "$POLL_INTERVAL_SECONDS"
                ELAPSED_SECONDS=$((ELAPSED_SECONDS + POLL_INTERVAL_SECONDS))
                ;;
            esac
          done

          if [ "$FINAL_STATUS" = "Pending" ] || [ "$FINAL_STATUS" = "InProgress" ] || [ "$FINAL_STATUS" = "Delayed" ] || [ -z "$FINAL_STATUS" ]; then
            echo "Deployment did not finish within ${DEPLOY_TIMEOUT_SECONDS}s"
            DEPLOY_FAILED=1
          fi

          echo "Deployment invocation details:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionEndDateTime:ExecutionEndDateTime}' \
            --output json || true

          echo "Deployment Output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "Deployment Errors:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' \
            --output text || true

          [ "$FINAL_STATUS" = "Success" ] || DEPLOY_FAILED=1

          [ -z "$DEPLOY_FAILED" ] || exit 1
