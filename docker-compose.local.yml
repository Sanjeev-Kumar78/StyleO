services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:8080
    container_name: styleo-frontend
    ports:
      - "4173:4173"
    networks:
      - styleo-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build: ./backend
    container_name: styleo-backend
    env_file:
      - backend/.env
    environment:
      FRONTEND_URL: http://localhost:4173
    command: >
      uv run uvicorn main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - styleo-net
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: styleo-worker
    env_file:
      - backend/.env
    command: >
      uv run taskiq worker workers.main:broker
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - styleo-net
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: styleo-redis
    ports:
      - "6379:6379"
    env_file:
      - backend/.env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"
             else
               exec redis-server --appendonly no
             fi'
    volumes:
      - redis_data:/data
    networks:
      - styleo-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q '^PONG$'; else redis-cli ping | grep -q '^PONG$'; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: styleo-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redis_insight_data:/data
    networks:
      - styleo-net
    restart: unless-stopped

volumes:
  redis_data:
  redis_insight_data:

networks:
  styleo-net:
    driver: bridge
